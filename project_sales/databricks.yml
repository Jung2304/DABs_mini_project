# This is a Declarative Automation Bundle definition for project_sales.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: project_sales
  uuid: e3bf28f6-4725-45cd-a27d-f9f4412bde8a

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets:
      name_prefix: dev_${workspace.current_user.short_name}_
      source_linked_deployment: false
    workspace:
      host: https://dbc-ff77887e-59a5.cloud.databricks.com/
    variables:
      catalog: default
      schema: dev
  
  prod:
    mode: production
    workspace:
      host: https://dbc-ff77887e-59a5.cloud.databricks.com/
      # We explicitly deploy to /Workspace/Users/minhdung38109141@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/minhdung38109141@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: default
      schema: prod
    permissions:
      - user_name: minhdung38109141@gmail.com
        level: CAN_MANAGE
